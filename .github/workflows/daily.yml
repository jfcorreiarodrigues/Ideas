name: Daily Ideas Radar

on:
  schedule:
    # 07:00 UTC = 08:00 Lisboa (inverno) / 08:00 Lisboa no verao - basta
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/app-idea-radar-UkGD5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run daily job
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-2.5-flash-lite
        run: python daily_job.py

      - name: Commit & push updated data
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/history.json data/latest.json
          if git diff --staged --quiet; then
            echo "Sem mudancas para fazer commit."
          else
            git commit -m "chore(daily): ideias $(date -u +%Y-%m-%d)"
            git push origin HEAD:claude/app-idea-radar-UkGD5
          fi
